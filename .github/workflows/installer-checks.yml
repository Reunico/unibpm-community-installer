name: Installer checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    name: Installer config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install envsubst
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext-base
      - name: Check installer configuration
        run: python3 tests/check_installer.py

  docker-smoke:
    name: Installer Docker smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install envsubst
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext-base
      - name: Run all installer modes in Docker
        run: python3 tests/check_installer.py --docker
