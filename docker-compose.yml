services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - unibpm
    volumes:
      - ./generated/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt/www:/var/www/certbot
      - ./letsencrypt/conf:/etc/letsencrypt
    depends_on:
      - unibpm-frontend
      - unibpm-keycloak
      - unibpm-engine
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - ./letsencrypt/www:/var/www/certbot
      - ./letsencrypt/conf:/etc/letsencrypt
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - unibpm
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - unibpm
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  unibpm-keycloak:
    image: cr.yandex/crp1uqso77nujlub6a96/unibpm-keycloak:1.0.0
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PUBLIC_PORT:-8082}:8080"
    restart: unless-stopped
    command:
      - "start"
      - "--import-realm"
      - "--spi-export-import-strategy=OVERWRITE_EXISTING"
    volumes:
      - ./keycloak/config:/opt/keycloak/data/import
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: ${KEYCLOAK_DATABASE_HOST}
      KC_DB_URL_PORT: ${KEYCLOAK_DATABASE_PORT}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DATABASE_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS}
      KC_PROXY: ${KEYCLOAK_PROXY}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: ${KEYCLOAK_ENABLE_STATISTICS}
      KC_CACHE: ${KEYCLOAK_CACHE_TYPE}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT}
      KC_HOSTNAME_STRICT_HTTPS: ${KEYCLOAK_HOSTNAME_STRICT_HTTPS}
      KC_LOG: ${KEYCLOAK_LOG_OUTPUT}
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL}
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: ${KEYCLOAK_ENABLE_HTTPS}
      KC_HTTP_PORT: ${KEYCLOAK_HTTP_PORT}
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_PATH}
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_EXTERNAL_URL}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_EXTERNAL_URL}
      UNIBPM_BRAND_PROFILE: community
    networks:
      - unibpm
    healthcheck:
      test: >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
        printf "GET %s/health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" "$${KC_HTTP_RELATIVE_PATH%/}" >&3;
        IFS= read -r status <&3;
        [[ "$${status}" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  unibpm:
    image: cr.yandex/crp1uqso77nujlub6a96/unibpm-app:1.0.5
    platform: linux/amd64
    volumes:
      - ./generated/unibpm/application.yaml:/config/application.yaml:ro
    ports:
      - "${BACKEND_PUBLIC_PORT:-8099}:8099"
    networks:
      - unibpm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      unibpm-keycloak:
        condition: service_healthy

  unibpm-frontend:
    image: cr.yandex/crp1uqso77nujlub6a96/unibpm-frontend:1.0.5
    platform: linux/amd64
    depends_on:
      - unibpm
    networks:
      - unibpm
    expose:
      - "80"
    ports:
      - "${FRONT_PUBLIC_PORT:-8080}:80"
    restart: unless-stopped

  unibpm-engine:
    image: cr.yandex/crp1uqso77nujlub6a96/unibpm-engine:1.0.0
    platform: linux/amd64
    volumes:
      - ./generated/engine/application.yaml:/config/application.yaml:ro
    ports:
      - "${CAMUNDA_PUBLIC_PORT:-8081}:8080"
    networks:
      - unibpm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      unibpm-keycloak:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:

networks:
  unibpm:
    driver: bridge
